server {
    listen 80;
    server_name localhost;

    # Docker 내부 DNS Resolver 지정 (127.0.0.11)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Ingress Layer Health Check Endpoint (IDD v4.0 5.2절)
    location /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
    }

    # API Routing Matrix (변수를 사용하여 기동 시점 Host Lookup 에러 방지)
    location /api/v1/assets {
        set $asset_svc http://sftwin-asset-svc:8000;
        proxy_pass $asset_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/simulations {
        set $sim_svc http://sftwin-sim-svc:8001;
        proxy_pass $sim_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/kpi {
        set $kpi_svc http://sftwin-kpi-svc:8002;
        proxy_pass $kpi_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}