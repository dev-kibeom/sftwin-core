name: SF-Twin Lightweight Dev CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  # 1. 파이썬 문법 검사 및 기본 단위 테스트
  python-quick-check:
    name: Python Quick Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio fastapi uvicorn pydantic

      - name: Lint Syntax Errors Only (E9, F63, F7, F82)
        run: |
          flake8 core/src/ plugins/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Python Tests (Pass if empty)
        env:
          PYTHONPATH: core/src:plugins:.
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v || true
          else
            echo "No tests directory found. Skipping."
          fi

  # 2. C++ 네이티브 빌드/테스트 (필요 시 유지, 스크립트 존재 시에만 실행)
  cpp-quick-check:
    name: C++ Native Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and Execute C++ Tests
        run: |
          if [ -f "core/run_cpp_tests.sh" ]; then
            sudo apt-get update && sudo apt-get install -y cmake g++ libspdlog-dev protobuf-compiler libprotobuf-dev libgtest-dev
            chmod +x core/run_cpp_tests.sh
            ./core/run_cpp_tests.sh
          else
            echo "No C++ test script found. Skipping."
          fi
