name: SF-Twin Core CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. 린트, 아키텍처 표준(AST) 및 인프라 설정 검증
  lint-and-architecture:
    name: Lint & Architecture Compliance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Lint & Guard Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          flake8 core/src/ plugins/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 core/src/ plugins/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate Architectural Compliance (AST Static Check)
        env:
          PYTHONPATH: core/src:plugins:.
        run: |
          python -m pytest tests/test_code_standards.py -v

      - name: Create Dummy Env File for Validation
        run: |
          # 루트 및 infra 디렉토리에 더미 환경 변수 파일 생성
          mkdir -p infra
          if [ -f ".env.example" ]; then
            cp .env.example .env.local
            cp .env.example infra/.env.local
          elif [ -f "infra/.env.example" ]; then
            cp infra/.env.example infra/.env.local
            cp infra/.env.example .env.local
          else
            touch .env.local .env.shared infra/.env.local infra/.env.shared
          fi

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f "infra/docker-compose.yml" ]; then
            docker compose -f infra/docker-compose.yml config
          else
            echo "infra/docker-compose.yml not found, skipping."
          fi

  # 2. Python 단위 및 통합 테스트 스위트
  python-test-suite:
    name: Python Service Tests
    needs: lint-and-architecture
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pyjwt cryptography sqlalchemy pandas redis influxdb-client httpx pytest pytest-cov pytest-asyncio

      - name: Run Pytest Suite with Coverage
        env:
          PYTHONPATH: core/src:plugins:.
        run: |
          pytest --cov=core/src --cov=plugins --cov-report=term-missing tests/ core/src/ plugins/

  # 3. C++17 Native 에지 제어 및 시뮬레이션 빌드/테스트
  cpp-test-suite:
    name: C++17 Native Tests
    needs: lint-and-architecture
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C++ Toolchain & Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev protobuf-compiler libprotobuf-dev libgtest-dev

      - name: Execute C++ Unit Tests
        run: |
          chmod +x core/run_cpp_tests.sh
          ./core/run_cpp_tests.sh

  # 4. GHCR 컨테이너 이미지 빌드 및 Push (Push/Tag 이벤트 시에만 실행)
  build-and-push-ghcr:
    name: Build & Push GHCR Images
    needs: [python-test-suite, cpp-test-suite]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: app
            dockerfile: infra/Dockerfile
          - name: nginx
            dockerfile: infra/nginx/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
