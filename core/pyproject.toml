[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.importlinter]
root_package = "src"

# 1. shared 모듈 수칙
[[tool.importlinter.contracts]]
name = "Shared layer must not depend on feature modules"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = ["src.asset_twin", "src.edge_control", "src.kpi_b2b", "src.simulation"]

# 2. Domain 계층 독립성 수칙
[[tool.importlinter.contracts]]
name = "Domain layers must be completely independent"
type = "forbidden"
source_modules = [
    "src.asset_twin.asset_library.domain",
    "src.asset_twin.twin_reconstruction.domain",
    "src.kpi_b2b.b2b_procurement.domain",
    "src.kpi_b2b.kpi_dashboard.domain",
    "src.simulation.fault_injection_bt.domain",
    "src.simulation.fms_execution.domain"
]
forbidden_modules = [
    "src.asset_twin.asset_library.adapters",
    "src.asset_twin.asset_library.application",
    "src.kpi_b2b.b2b_procurement.adapters",
    "src.kpi_b2b.b2b_procurement.application",
    "src.simulation.fault_injection_bt.adapters",
    "src.simulation.fault_injection_bt.application"
]

# 3. Application 계층 수칙
[[tool.importlinter.contracts]]
name = "Application layer must not depend on Adapters"
type = "forbidden"
source_modules = [
    "src.asset_twin.asset_library.application",
    "src.asset_twin.twin_reconstruction.application",
    "src.kpi_b2b.b2b_procurement.application",
    "src.kpi_b2b.kpi_dashboard.application",
    "src.simulation.fault_injection_bt.application",
    "src.simulation.fms_execution.application"
]
forbidden_modules = [
    "src.asset_twin.asset_library.adapters",
    "src.asset_twin.twin_reconstruction.adapters",
    "src.kpi_b2b.b2b_procurement.adapters",
    "src.kpi_b2b.kpi_dashboard.adapters",
    "src.simulation.fault_injection_bt.adapters",
    "src.simulation.fms_execution.adapters"
]
