[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"

dependencies = [
    "pymysql",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.importlinter]
root_package = "src"

# 1. Shared 계층 고립 (src 하위의 모든 다른 기능 모듈 참조 금지)
[[tool.importlinter.contracts]]
name = "Shared layer must not depend on feature modules"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = ["src.*"]

# 2. Clean Architecture 계층 구조 강제 (깊이 무관 일괄 적용)
# domain은 application이나 facades를 참조할 수 없습니다.
[[tool.importlinter.contracts]]
name = "Domain layer isolation (Clean Architecture)"
type = "forbidden"
source_modules = [
    "src.*.domain",
    "src.*.*.domain",
    "src.*.*.*.domain"
]
forbidden_modules = [
    "src.*.application", "src.*.facades", "src.*.adapters",
    "src.*.*.application", "src.*.*.facades", "src.*.*.adapters",
    "src.*.*.*.application", "src.*.*.*.facades", "src.*.*.*.adapters"
]

# 3. Application 계층 구조 강제 (깊이 무관 일괄 적용)
# application은 외곽의 facades나 adapters를 참조할 수 없습니다.
[[tool.importlinter.contracts]]
name = "Application layer isolation (Clean Architecture)"
type = "forbidden"
source_modules = [
    "src.*.application",
    "src.*.*.application",
    "src.*.*.*.application"
]
forbidden_modules = [
    "src.*.facades", "src.*.adapters",
    "src.*.*.facades", "src.*.*.adapters",
    "src.*.*.*.facades", "src.*.*.*.adapters"
]
