syntax = "proto3";
package sftwin.telemetry;

// TensorRT YOLOv8 비전 감지 객체 DTO
message DetectedObject {
  string class_name = 1;      // 감지 객체 (예: "Worker", "AMR")
  float confidence = 2;       // AI 신뢰도 (0.0 ~ 1.0)
  repeated float bbox = 3;    // Bounding Box [x_min, y_min, width, height]
}

// 텔레메트리 패킷 (E2E 관제 & 웹 스트리밍용)
message TelemetryPacketProto {
  string device_id = 1;               // 현장 로봇/AMR/설비 고유 ID
  int64 timestamp_ns = 2;             // 생성 시점 Epoch Timestamp (ns)
  repeated double joint_positions = 3;// 관절별 위치 좌표 배열
  repeated double joint_torques = 4;  // 관절별 실시간 토크/전류 측정값
  string packml_state = 5;            // PackML 상태 지표
  bool is_warning = 6;                // 이상 포착 플래그

  // VRAM/메모리 파편화 방지를 위해 최대 10개로 제한 권장
  repeated DetectedObject detected_objects = 7;
  optional float anomaly_score = 8;             // PyTorch Autoencoder 복원 오차
}
