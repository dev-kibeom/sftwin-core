syntax = "proto3";
package sftwin.simulation;

message TrajectoryPoint {
  double x = 1;
  double y = 2;
  double z = 3;
  double velocity = 4;
}

message SimResultProto {
  string scenario_id = 1;
  bool is_success = 2;
  int32 collision_count = 3;
  float estimated_cycle_time_sec = 4;
  string evaluated_at = 5;
  repeated TrajectoryPoint trajectory_points = 6;
}
