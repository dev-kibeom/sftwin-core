syntax = "proto3";
package sftwin.eventbus;

import "google/protobuf/any.proto";

message EventHeader {
  string event_id = 1;
  string event_type = 2;
  string source_component = 3;
  int64 timestamp_ns = 4;
  string trace_id = 5;
}

message IntegrationEventProto {
  EventHeader header = 1;
  google.protobuf.Any payload = 2;
}
