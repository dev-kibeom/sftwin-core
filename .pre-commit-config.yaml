repos:
  # 1. 기본 파일 포맷팅 및 공백 검사
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # 2. Python 코드 포맷터 (Black)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10

  # 3. 아키텍처 규칙 검증 (자동 탐색 방식으로 전환)
  - repo: local
    hooks:
      - id: architectural-compliance
        name: Architectural Standards & Compliance Check
        # PYTHONPATH=core/src 환경변수를 명시하여 pytest 6.2.5 환경에서도 module import 에러 방지
        entry: bash -c "PYTHONPATH=core/src python3 -m pytest -k test_code_standards"
        language: system
        pass_filenames: false
        always_run: true
