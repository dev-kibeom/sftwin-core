repos:
  # 1. 기본 파일 포맷팅 및 공백 검사
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # 2. Python 코드 포맷터 (Black)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10

  # 3. Import-Linter (클린 아키텍처 의존성 정적 검사)
  - repo: local
    hooks:
      - id: import-linter
        name: Import-Linter Architecture Check
        entry: bash -c "cd core && PYTHONPATH=src lint-imports"
        language: system
        pass_filenames: false
        always_run: true

  # 4. AST 기반 코드 컨벤션 & 표준 검사 (test_code_standards.py)
  - repo: local
    hooks:
      - id: architectural-compliance
        name: Architectural Standards & Code Conventions Check
        entry: bash -c "PYTHONPATH=core/src python3 -m pytest tests/test_code_standards.py"
        language: system
        pass_filenames: false
        always_run: true
